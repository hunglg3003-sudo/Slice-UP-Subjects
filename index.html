<script type="module">
import * as THREE from 'three';
/* ===== Tuỳ chỉnh: điền đường dẫn ảnh thật (file cục bộ cùng thư mục) nếu muốn ===== */
const BOOK_IMAGES=[];   // vd ['img/vatli10.jpg', ...]  (ảnh bìa SGK Kết Nối Tri Thức)
const PAPER_IMAGES=[];  // vd ['img/de_toan.jpg', ...]  (đề kiểm tra)
let PEOPLE_IMAGES=[];   // hoặc chọn ảnh trong chế độ bí mật
const SECRET_B64='cGh1bmh1YW4='; // mật mã (mã hoá base64)

const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const LV={
 easy:{dur:60,n:[30,45],torn:[8,11],lives:10,T:[3.8,3.8],th:'easy'},
 medium:{dur:90,n:[45,60],torn:[10,14],lives:5,T:[3.3,3.3],th:'medium'},
 hard:{dur:150,n:[60,100],torn:[25,30],lives:3,T:[2.4,3.9],th:'hard'},
 secret:{dur:90,n:[60,60],torn:[10,15],lives:3,T:[3.6,3.6],th:'secret'}};
const REACH=2.0;
const PTS={book:[100,75,50,25],paper:[150,125,100,65],pic:[100,50,25,10]},PEN={book:-50,paper:-100,pic:-500};
const RT=[['PERFECT!','#ffd23f','perfect'],['GOOD','#3ddc84'],['DECENT','#38bdf8'],['BAD','#c084fc']];
const SUBJ=[['Toán','#2563eb'],['Vật lí','#7c3aed'],['Hoá học','#059669'],['Sinh học','#16a34a'],['Ngữ văn','#dc2626'],['Lịch sử','#b45309'],['Địa lí','#0891b2'],['Tin học','#475569']];

/* ===== Three.js ===== */
const R=new THREE.WebGLRenderer({alpha:true,antialias:true});R.setClearColor(0,0);$('gl').appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,1,.05,100);let W,H;
function rs(){W=innerWidth;H=innerHeight;R.setSize(W,H);R.setPixelRatio(Math.min(devicePixelRatio,2));C.aspect=W/H;C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const video=$('cam');
function toScreen(l){const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);
 return new THREE.Vector2((1-l.x)*vw*s-(vw*s-W)/2,l.y*vh*s-(vh*s-H)/2)}
function pxToWorld(x,y,Z){const d=new THREE.Vector3(x/W*2-1,1-y/H*2,.5).unproject(C).sub(C.position).normalize();return d.multiplyScalar(Z/-d.z)}

class OE{constructor(mc=1.6,b=.012){this.mc=mc;this.b=b;this.x=null;this.dx=new THREE.Vector2()}
 a(c,dt){const r=6.2832*c*dt;return r/(r+1)}
 f(v,dt){if(!this.x){this.x=v.clone();this.dx.set(0,0);return this.x.clone()}
  const d=v.clone().sub(this.x).divideScalar(dt);this.dx.lerp(d,this.a(1,dt));
  this.x.lerp(v,this.a(this.mc+this.b*this.dx.length(),dt));return this.x.clone()}
 reset(){this.x=null}}
/* ===== Sabers (aura quanh bàn tay) ===== */
const sabers=[0x38bdf8,0xf472b6].map(col=>{
 const g=new THREE.Group(),add=(r,o,c)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,12),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(m)};
 add(.012,1,0xffffff);add(.04,.55,col);add(.09,.2,col);
 const a=new THREE.Mesh(new THREE.SphereGeometry(.1,16,16),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));
 g.add(a);g.userData.aura=a;g.visible=false;S.add(g);
 return{g,p0:new THREE.Vector2(),p1:new THREE.Vector2(),on:false,lost:0,f0:new OE(),f1:new OE()}});
function placeSaber(s){const A=pxToWorld(s.p0.x,s.p0.y,1),B=pxToWorld(s.p1.x,s.p1.y,1),d=B.clone().sub(A),L=d.length();
 s.g.children.slice(0,3).forEach(m=>{m.scale.set(1,L,1);m.position.copy(A).add(B).multiplyScalar(.5).sub(s.g.position);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize())});
 d.normalize();s.g.userData.aura.position.copy(A);s.g.visible=true}

/* ===== Hand tracking (MediaPipe) ===== */
let hl=null,pl=null,mouse=false;
async function initTracking(){
 try{
  video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720}});await video.play();
  const {HandLandmarker,PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  hl=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.4});
  try{pl=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4,minTrackingConfidence:.4})}catch(e){console.warn('pose',e)}
  $('status').textContent='Camera sẵn sàng ✓';setTimeout(()=>$('status').remove(),3000);
 }catch(e){mouse=true;$('status').textContent='Không dùng được camera/hand-tracking → chế độ chuột ('+e.message+')'}}
addEventListener('mousemove',e=>{if(!mouse)return;const s=sabers[0];s.p0.set(e.clientX,e.clientY);s.p1.set(e.clientX,e.clientY-90);s.on=true});
let lastVT=-1,lastT=0;const V2=THREE.Vector2;
function trackHands(){
 if(!hl||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
 const T=performance.now(),dt=Math.min(.1,Math.max(.008,(T-lastT)/1000));lastT=T;
 const hr=hl.detectForVideo(video,T),arms=[],shs=[];let sw=160;
 if(pl){const P=pl.detectForVideo(video,T).landmarks[0];
  if(P){for(const i of[11,12,23,24])if((P[i].visibility??1)>.5)shs.push(toScreen(P[i]));if((P[11].visibility??1)>.5&&(P[12].visibility??1)>.5)sw=toScreen(P[11]).distanceTo(toScreen(P[12]))}
  if(P)for(const[el,wr,ix]of[[13,15,19],[14,16,20]])if((P[el].visibility??1)>.6&&(P[wr].visibility??1)>.6)arms.push({el:toScreen(P[el]),wr:toScreen(P[wr]),ix:toScreen(P[ix]),u:false})}
 const dets=[];
 for(const[hi,L]of hr.landmarks.entries()){const pt=i=>toScreen(L[i]),w=pt(0),d1=pt(9).sub(w),d2=pt(12).sub(pt(9)),size=d1.length(),k=Math.min(1,size/50),
   palm=[0,5,9,13,17].reduce((a,i)=>a.add(pt(i)),new V2()).multiplyScalar(.2);
  if((hr.handedness?.[hi]?.[0]?.score??1)<.6||size<14)continue;
  const wid=pt(5).distanceTo(pt(17));if(wid<8||size/wid<.5||size/wid>4)continue;
  const dir=d1.clone().normalize().multiplyScalar(k).add(d2.normalize().multiplyScalar(.3*k));
  let best=null,bd=1e9;for(const a of arms){const q=a.wr.distanceTo(w);if(q<bd){bd=q;best=a}}
  const ok=best&&bd<size*3+60;if(!ok&&shs.some(q=>q.distanceTo(palm)<sw*.5))continue;if(ok){best.u=true;dir.add(best.wr.clone().sub(best.el).normalize().multiplyScalar(.5))}
  if(dir.lengthSq()<1e-6)dir.set(0,-1);dir.normalize();
  dets.push({p0:palm,p1:palm.clone().add(dir.multiplyScalar(Math.max(size*3.6,105))),c:2})}
 for(const a of arms)if(!a.u){const o=a.wr.clone().lerp(a.ix,.5);if(dets.some(d=>d.p0.distanceTo(o)<120)||shs.some(q=>q.distanceTo(a.wr)<sw*.4))continue;
  const dir=a.wr.clone().sub(a.el).normalize();dets.push({p0:o,p1:o.clone().add(dir.multiplyScalar(Math.max(a.wr.distanceTo(a.el)*.55,105))),c:1})}
 dets.sort((a,b)=>b.c-a.c);dets.length=Math.min(dets.length,2);
 const pairs=[];dets.forEach((d,i)=>sabers.forEach((s,j)=>pairs.push([s.on?d.p0.distanceTo(s.p0):1e4+j,i,j])));
 pairs.sort((a,b)=>a[0]-b[0]);const du=new Set(),su=new Set();
 for(const[,i,j]of pairs){if(du.has(i)||su.has(j))continue;du.add(i);su.add(j);const s=sabers[j],d=dets[i];
  if(!s.on||d.p0.distanceTo(s.p0)>450){s.f0.reset();s.f1.reset()}
  s.p0.copy(s.f0.f(d.p0,dt));s.p1.copy(s.f1.f(d.p1,dt));s.on=true;s.lost=0}
 sabers.forEach((s,j)=>{if(!su.has(j)&&s.on){s.lost+=dt;if(s.lost>.3)s.on=false}})}

/* ===== Texture procedural (hoặc ảnh thật) ===== */
const rr=(x,c,w,h,t)=>{x.fillStyle=c;x.fillRect(0,0,w,h)};
function drawBook(x,i){const[n,c]=SUBJ[i%SUBJ.length],w=256,h=340;rr(x,c,w,h);x.fillStyle='rgba(255,255,255,.15)';x.beginPath();x.arc(200,260,110,0,7);x.fill();
 x.fillStyle='#fff';x.fillRect(0,0,w,50);x.fillStyle=c;x.font='bold 20px sans-serif';x.textAlign='center';x.fillText('SÁCH GIÁO KHOA',w/2,32);
 x.fillStyle='#fff';x.font='bold 46px sans-serif';x.fillText(n.toUpperCase(),w/2,160);x.font='bold 64px sans-serif';x.fillText('10',w/2,235);
 x.font='bold 15px sans-serif';x.fillText('KẾT NỐI TRI THỨC',w/2,300);x.fillText('VỚI CUỘC SỐNG',w/2,320)}
function drawPaper(x,i){const[n,c]=SUBJ[i%SUBJ.length],w=256,h=352;rr(x,'#fbfbf4',w,h);x.fillStyle='#111';x.textAlign='center';x.font='bold 13px sans-serif';
 x.fillText('TRƯỜNG THPT PHÚ NHUẬN',w/2,24);x.fillStyle=c;x.font='bold 17px sans-serif';x.fillText('ĐỀ KIỂM TRA MÔN '+n.toUpperCase(),w/2,50);
 x.fillStyle='#444';x.textAlign='left';x.font='12px sans-serif';for(let q=1;q<=7;q++){x.fillText('Câu '+q+'. ........................................',16,60+q*34);x.fillStyle='#bbb';x.fillRect(16,70+q*34,200-q*6,3);x.fillStyle='#444'}
 x.fillStyle='#e11';x.font='italic bold 34px cursive';x.fillText(ri(5,10)+','+ri(0,9),170,325)}
function drawPic(x,i){const E=['🧑‍🎓','👩‍🏫','👨‍💻','👩‍🔬','🧑‍🚀','🧑‍🎤','👨‍🍳','🧑‍🎨'];rr(x,'#222',256,300);x.fillStyle=SUBJ[i%8][1];x.fillRect(10,10,236,280);
 x.font='140px serif';x.textAlign='center';x.fillText(E[i%8],128,190)}
function tear(x,w,h){x.globalCompositeOperation='destination-out';x.beginPath();x.moveTo(0,0);let px=w*rnd(.35,.6);for(let t=0;t<=8;t++)x.lineTo(px*(1-t/8)+(t%2?12:-4),h*.5*t/8);x.lineTo(0,h*.5);x.fill();
 x.beginPath();x.moveTo(w,h);x.lineTo(w*.55,h);for(let t=0;t<=8;t++)x.lineTo(w*(.55+.45*t/8)+(t%2?-10:6),h*(1-.4*t/8));x.fill();
 x.globalCompositeOperation='source-atop';x.strokeStyle='rgba(120,30,20,.7)';x.lineWidth=5;for(let t=0;t<6;t++){x.beginPath();x.moveTo(rnd(0,w),rnd(0,h));x.lineTo(rnd(0,w),rnd(0,h));x.stroke()}
 x.fillStyle='rgba(90,40,10,.28)';x.fillRect(0,0,w,h);x.globalCompositeOperation='source-over'}
const cache={};
function getTex(kind,i,torn){const key=kind+i+torn;if(cache[key])return cache[key];
 const c=document.createElement('canvas'),w=256,h=kind==='book'?340:kind==='paper'?352:300;c.width=w;c.height=h;const x=c.getContext('2d'),t=new THREE.CanvasTexture(c);
 const D={book:drawBook,paper:drawPaper,pic:drawPic}[kind],urls={book:BOOK_IMAGES,paper:PAPER_IMAGES,pic:PEOPLE_IMAGES}[kind];
 const fin=()=>{if(torn)tear(x,w,h);t.needsUpdate=true};
 if(urls.length){D(x,i);const im=new Image();im.onload=()=>{x.clearRect(0,0,w,h);x.drawImage(im,0,0,w,h);fin()};im.src=urls[i%urls.length]}else{D(x,i)}
 fin();return cache[key]=t}

/* ===== Âm nhạc (WebAudio, lấy cảm hứng Tetris) ===== */
const TH={
 menu:{bpm:150,w:'square',v:.06,lead:[76,0,71,72,74,0,72,71,69,0,69,72,76,0,74,72,71,0,0,72,74,0,76,0,72,0,69,0,69,0,0,0],bass:[45,52,45,52,44,52,45,52]},
 easy:{bpm:130,w:'square',v:.06,lead:[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,79],bass:[48,53,55,48]},
 medium:{bpm:150,w:'square',v:.06,lead:[69,72,76,72,69,72,77,76,74,77,81,77,76,74,72,71],bass:[45,41,43,40]},
 hard:{bpm:180,w:'sawtooth',v:.05,lead:[64,64,76,64,64,74,64,64,72,64,64,71,72,64,74,64,67,67,79,67,67,77,67,67,76,67,66,67,64,0,0,0],bass:[40,40,43,38,40,40,45,47]},
 secret:{bpm:115,w:'triangle',v:.12,lead:[60,63,66,63,60,0,59,62,65,62,59,0,58,61,64,61,58,0,57,0],bass:[36,35,34,33]}};
let ac,mt,ms=0;
function note(m,t,d,w,v){const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function music(n){clearInterval(mt);if(!n||!ac)return;const th=TH[n],st=30/th.bpm;ms=0;
 mt=setInterval(()=>{const t=ac.currentTime+.05,l=th.lead[ms%th.lead.length],b=th.bass[(ms>>1)%th.bass.length];if(l)note(l,t,st*.9,th.w,th.v);if(ms%2==0)note(b,t,st*1.8,'triangle',.1);ms++},st*1000)}
const sfx=(m,w='sine',d=.15,v=.15)=>ac&&note(m,ac.currentTime,d,w,v);
function audioOn(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}

/* ===== Game ===== */
let cd=0,state='menu',lvKey='easy',cfg,g=0,objs=[],queue=[],score=0,lives=0,hit=0,total=0,parts=[],last=0,spawned=0;
function start(k){audioOn();lvKey=k;cfg=LV[k];state='play';
 objs.forEach(o=>S.remove(o.m));objs=[];parts.forEach(p=>S.remove(p.m));parts=[];
 const N=ri(...cfg.n),Tn=ri(...cfg.torn),types=[];total=N;
 for(let i=0;i<N;i++)types.push(i<Tn);types.sort(()=>Math.random()-.5);
 const t0=1.5,span=cfg.dur-t0-cfg.T[1];queue=types.map((tr,i)=>({at:t0+span*(i+Math.random()*.9)/N,torn:tr}));
 score=0;lives=cfg.lives;hit=0;spawned=0;g=-2;
 ['menu','end'].forEach(i=>$(i).classList.remove('on'));$('hud').style.display='flex';music(cfg.th)}
function spawn(q){const kind=lvKey==='secret'?'pic':Math.random()<.5?'book':'paper',i=ri(0,7),tex=getTex(kind,i,q.torn),tint=q.torn?0xffb0a0:0xffffff;
 const side=Math.random()<.5?-1:1;let m;
 if(kind==='book'){const s=new THREE.MeshBasicMaterial({color:q.torn?0x6b3a30:0xf2f2f2,transparent:true}),f=new THREE.MeshBasicMaterial({map:tex,color:tint,transparent:true});m=new THREE.Mesh(new THREE.BoxGeometry(.46,.6,.1),[s,s,s,s,f,s])}
 else m=new THREE.Mesh(new THREE.PlaneGeometry(.48,kind==='paper'?.66:.54),new THREE.MeshBasicMaterial({map:tex,color:tint,transparent:true,alphaTest:.05,side:THREE.DoubleSide}));
 const a=new THREE.Vector3(side*rnd(1.5,5),rnd(7,11),-22),b=new THREE.Vector3(side*rnd(.1,.7),rnd(-.3,.35),-1.2);
 m.position.copy(a);S.add(m);objs.push({m,mats:m.material.length?m.material:[m.material],a,b,kind,torn:q.torn,sp:g,T:rnd(...cfg.T),ph:rnd(0,6)});objs[objs.length-1].mats.forEach(x=>x.opacity=.45);spawned++}
function pop(x,y,txt,sub,col,cls){const d=document.createElement('div');d.className='pop '+(cls||'');d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;d.innerHTML=txt+(sub?'<small style="color:'+col+'">'+sub+'</small>':'');document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
const PG=new THREE.SphereGeometry(.02,6,6);
function burst(p,col,n=30,sp=2){for(let i=0;i<n;i++){const m=new THREE.Mesh(PG,new THREE.MeshBasicMaterial({color:col,transparent:true,blending:THREE.AdditiveBlending}));m.position.copy(p);S.add(m);parts.push({m,v:new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(sp*rnd(.4,1)),l:1})}}
function loseLife(){lives--;const f=$('flash');f.style.transition='none';f.style.opacity=.45;requestAnimationFrame(()=>{f.style.transition='opacity .4s';f.style.opacity=0});if(lives<=0)finish(false)}
function segDist(p,a,b){const ab=b.clone().sub(a),t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/(ab.lengthSq()||1)));return p.distanceTo(a.clone().add(ab.multiplyScalar(t)))}
function finish(win){if(state!=='play')return;state='end';music(null);
 const good=total-objs.length-0,cnt=queue.length;
 const nonTorn=Math.max(1,hitTotal());$('hud').style.display='none';
 $('et').textContent=win?'CHIẾN THẮNG! 🎉':'GAME OVER';
 $('es').innerHTML='Điểm: <b>'+score+'</b><br>Độ chính xác: <b>'+Math.round(hit/nonTorn*100)+'%</b>';$('end').classList.add('on');
 if(win)sfx(88,'square',.5)}
let tornTotal=0;const hitTotal=()=>total-tornTotal;

function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;
 trackHands();sabers.forEach(s=>{if(s.on)placeSaber(s);else s.g.visible=false});
 if(state==='play'){g+=dt;
  $('msg').textContent=g<0?(g<-1?'SẴN SÀNG…':'BẮT ĐẦU!'):'';
  while(queue.length&&queue[0].at<=g)spawn(queue.shift());
  const cand=[];for(const o of [...objs]){const u=(g-o.sp)/o.T;o.m.position.lerpVectors(o.a,o.b,Math.min(u,1.0));o.m.position.y=o.a.y+(o.b.y-o.a.y)*Math.pow(Math.min(u,1),1.5);o.m.rotation.set(Math.sin(g*2+o.ph)*.3,Math.sin(g*1.5+o.ph)*.5,Math.sin(g*3+o.ph)*.4);
   if(u>=1){S.remove(o.m);objs.splice(objs.indexOf(o),1);if(!o.torn){pop(W/2,H*.62,'MISS','−1 ❤','#ff4d4d');sfx(120,'sawtooth',.3);loseLife()}continue}
   const inr=o.T*(1-u)<=REACH;if(inr!==o.inr){o.inr=inr;o.mats.forEach(x=>x.opacity=inr?1:.45)}if(!inr)continue;
   const v=o.m.position.clone().project(C),sp=new THREE.Vector2((v.x+1)/2*W,(1-v.y)/2*H),r=.38*(H/2)/(Math.tan(C.fov*Math.PI/360)*-o.m.position.z)+14;
   if(!sabers.some(s=>s.on&&segDist(sp,s.p0,s.p1)<r))continue;cand.push({o,sp,u});}
  cd-=dt;if(cd<=0&&cand.length){const{o,sp,u}=cand.reduce((a,b)=>b.u>a.u?b:a);cd=.25;S.remove(o.m);objs.splice(objs.indexOf(o),1);
   if(o.torn){score+=PEN[o.kind];burst(o.m.position,0xff5522,70,3.5);sfx(60,'sawtooth',.5,.3);pop(sp.x,sp.y,'💥 '+PEN[o.kind],'−1 ❤','#ff6b3d');loseLife()}
   else{const tl=o.T*(1-u),i=tl<=.6?0:tl<=1?1:tl<=1.5?2:3,p=PTS[o.kind][i];score+=p;hit++;
    burst(o.m.position,new THREE.Color(RT[i][1]),26);sfx(72+i*-3+ri(0,4)*2,'square',.12);pop(sp.x,sp.y,RT[i][0],'+'+p+' · còn '+tl.toFixed(1)+'s',RT[i][1],RT[i][2])}
  }
  if(state==='play'&&queue.length===0&&objs.length===0&&g>1)finish(true);
  $('hs').textContent='Điểm '+score;$('ht').textContent=Math.max(0,Math.ceil(cfg.dur-g))+'s';$('hl').textContent='❤'.repeat(Math.max(0,Math.min(lives,12)))+(lives>12?' ×'+lives:'');
 }
 for(const p of [...parts]){p.l-=dt*1.4;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.l);if(p.l<=0){S.remove(p.m);parts.splice(parts.indexOf(p),1)}}
 R.render(S,C)}
// tính số vật rách thực tế: đếm trong start()
const _start=start;start=function(k){_start(k);tornTotal=queue.filter(q=>q.torn).length};

/* ===== UI ===== */
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>start(b.dataset.lv));
$('retry').onclick=()=>start(lvKey);
$('home').onclick=()=>{state='menu';$('end').classList.remove('on');$('menu').classList.add('on');$('hud').style.display='none';objs.forEach(o=>S.remove(o.m));objs=[];audioOn();music('menu')};
addEventListener('pointerdown',()=>{audioOn();if(state==='menu'&&!mt)music('menu')},{once:false});
let buf='';addEventListener('keydown',e=>{if(state!=='menu'||e.key.length!==1)return;audioOn();buf=(buf+e.key.toLowerCase()).slice(-8);
 if(buf.length===8&&btoa(buf)===SECRET_B64){$('secret').style.display='block';sfx(84,'square',.4)}});
$('ppl').onchange=e=>{PEOPLE_IMAGES=[...e.target.files].map(f=>URL.createObjectURL(f));Object.keys(cache).filter(k=>k.startsWith('pic')).forEach(k=>delete cache[k])};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
initTracking();requestAnimationFrame(frame);
</script></body></html>
